# LLDPq-IB demo devices.yaml -- 4 spine + 8 leaf + 16 HCA fake fabric.
#
# Copied into /home/lldpq/lldpq/devices.yaml at container start when the
# image is launched with LLDPQ_DEMO=true. The default username matches the
# fake credentials used by the demo dataset:
#
#   ssh username: nvidia
#   ssh password: Nvidia@123      <-- demo only, never used by ib-monitor
#                                     (LLDPq-IB collects via SSH key auth)
#
# In a real deployment, replace this file with your own devices.yaml and
# remove the LLDPQ_DEMO=true env var.

defaults:
  username: nvidia

# LLDPq-IB only polls switches (HCAs come from `ib ibnetdiscover` output via
# topology JSON, not from devices.yaml). The 16 ib-host-* HCAs in the demo
# fabric are visible on the Topology page even though they are not listed
# here -- this matches a real-world deployment.

devices:
  # ----- Spines (Quantum-2 NDR) -----
  10.10.100.10: ib-spine-01 @spine
  10.10.100.11: ib-spine-02 @spine
  10.10.100.12: ib-spine-03 @spine
  10.10.100.13: ib-spine-04 @spine

  # ----- Leaves (Quantum-2 NDR) -----
  10.10.100.20: ib-leaf-01 @leaf
  10.10.100.21: ib-leaf-02 @leaf
  10.10.100.22: ib-leaf-03 @leaf
  10.10.100.23: ib-leaf-04 @leaf
  10.10.100.24: ib-leaf-05 @leaf
  10.10.100.25: ib-leaf-06 @leaf
  10.10.100.26: ib-leaf-07 @leaf
  10.10.100.27: ib-leaf-08 @leaf

endpoint_hosts:
  - "ib-host-*"
