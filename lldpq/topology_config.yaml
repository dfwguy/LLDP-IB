# =============================================================================
# TOPOLOGY_CONFIG.YAML -- LLDPq-IB Topology Display Configuration
# =============================================================================
#
# Drives layer placement on the Topology page (topology/main.html) and the
# device-category icons used in the visual fabric diagram.
#
# Pattern matching is REGEX, evaluated against each hostname. First match wins.
#
# Examples:
#   - "spine"            matches any hostname containing "spine"
#   - "^ib-spine-"       matches hostnames starting with "ib-spine-"
#   - "ib-leaf-[0-9]+$"  matches "ib-leaf-01", "ib-leaf-02", ...
#   - "border|edge"      matches devices containing "border" OR "edge"
#
# Possible icons:
#   - switch      (default for IB switches; renders as a rack switch)
#   - router      (multi-subnet / IB router)
#   - host        (HCA-bearing server)
#   - server      (alternative to host)
#   - firewall    (rare in IB networks)
#   - unknown     (fallback)
#
# Topology mode:
#   - minimal -> generate_topology.py (faster, switches only)
#   - full    -> generate_topology_full.py (switches + every HCA neighbour)

topology: minimal  # [full] or [minimal]

device_categories:

  # IB core (multi-subnet routers; uncommon in single-fabric deployments)
  - pattern: "^ib-core-|^core-"
    layer: 1
    icon: "router"

  # Spines (top of the fat-tree)
  - pattern: "^ib-spine-|spine"
    layer: 2
    icon: "switch"

  # Leaves (ToR / aggregation)
  - pattern: "^ib-leaf-|leaf"
    layer: 3
    icon: "switch"

  # Hosts (HCA endpoints)
  - pattern: "^ib-host-|host|dgx|gpu"
    layer: 4
    icon: "host"

  # Generic switch fallback for hostnames that don't match the above
  - pattern: "switch"
    layer: 3
    icon: "switch"

# Default category for unmatched hostnames
default:
  layer: 9
  icon: "host"
