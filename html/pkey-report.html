<!DOCTYPE html>
<html>
<head>
    <link rel="shortcut icon" href="/png/favicon.ico">
    <title>..::LLDPQ-IB:: P_Key Report</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="css/lldpq-ib.css">
    <script src="css/auth.js"></script>
    <script src="css/lldpq-ib.js"></script>
</head>
<body>
    <div class="page-header">
        <div>
            <div class="page-title">P_Key (Partition) Report</div>
            <div class="last-updated" id="last-updated"></div>
        </div>
        <div class="action-buttons">
            <button class="btn btn-secondary admin-only" onclick="openPolicyEditor()">Edit expected_pkeys.yaml</button>
        </div>
    </div>

    <div id="banner"></div>

    <div class="summary-grid">
        <div class="summary-card card-total"><div class="card-value" id="total-pkeys">-</div><div class="card-label">Total P_Keys</div></div>
        <div class="summary-card card-info"><div class="card-value" id="devices-polled">-</div><div class="card-label">Devices Polled</div></div>
        <div class="summary-card card-warning"><div class="card-value" id="inconsistency-count">-</div><div class="card-label">Inconsistencies</div></div>
        <div class="summary-card card-success"><div class="card-value" id="ipoib-count">-</div><div class="card-label">IPoIB Enabled</div></div>
        <div class="summary-card card-warning"><div class="card-value" id="policy-count">-</div><div class="card-label">Policy Findings</div></div>
    </div>
    <div id="policy-section" style="display:none; margin-bottom: 18px;"></div>

    <div class="filter-bar">
        <div class="filter-group">
            <label>Filter</label>
            <select id="filter-mode" onchange="renderTable()">
                <option value="all">All P_Keys</option>
                <option value="inconsistent">Inconsistent only</option>
                <option value="ipoib">IPoIB only</option>
            </select>
        </div>
        <div class="filter-group">
            <label>Search</label>
            <input type="text" id="filter-search" placeholder="Name, P_Key, or device..." oninput="renderTable()" autocomplete="off">
        </div>
    </div>

    <div class="table-container">
        <table class="data-table">
            <thead>
                <tr>
                    <th>P_Key</th>
                    <th>Name(s)</th>
                    <th>IPoIB</th>
                    <th>MTU</th>
                    <th>Rate</th>
                    <th>Devices</th>
                    <th>Members</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="pkey-table">
                <tr><td colspan="8"><div class="loading"><div class="spinner"></div>Loading P_Key data...</div></td></tr>
            </tbody>
        </table>
    </div>

    <div id="policy-editor-overlay" style="position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:1000;display:none;align-items:center;justify-content:center;" onclick="if(event.target===this)closePolicyEditor()">
        <div style="background:#1e1e1e;border:1px solid #404040;border-radius:8px;width:80vw;max-width:1100px;height:80vh;display:flex;flex-direction:column;box-shadow:0 12px 50px rgba(0,0,0,0.6);">
            <div style="padding:14px 20px;background:#252526;border-bottom:1px solid #3c3c3c;border-radius:8px 8px 0 0;display:flex;align-items:center;justify-content:space-between;">
                <div>
                    <span style="color:#76b900;font-weight:600;font-size:14px;">Edit expected_pkeys.yaml</span>
                    <span id="policy-editor-path" style="color:#888;font-size:12px;font-family:monospace;margin-left:12px;"></span>
                </div>
                <button onclick="closePolicyEditor()" style="background:none;border:0;color:#aaa;font-size:22px;cursor:pointer;line-height:1;padding:0 6px;">&times;</button>
            </div>
            <div style="flex:1;display:flex;flex-direction:column;padding:12px 20px;gap:8px;min-height:0;">
                <textarea id="policy-editor-textarea" spellcheck="false" placeholder="Loading..."
                    style="flex:1;background:#111;color:#d4d4d4;border:1px solid #333;border-radius:4px;padding:12px;font-family:'Cascadia Code',Consolas,'Courier New',monospace;font-size:13px;line-height:1.5;resize:none;tab-size:2;"></textarea>
            </div>
            <div style="padding:12px 20px;background:#252526;border-top:1px solid #3c3c3c;border-radius:0 0 8px 8px;display:flex;align-items:center;justify-content:space-between;">
                <div id="policy-editor-status" style="color:#888;font-size:12px;"></div>
                <div style="display:flex;gap:8px;">
                    <button onclick="closePolicyEditor()" style="padding:7px 18px;border:0;border-radius:4px;cursor:pointer;font-size:13px;background:#404040;color:#fff;">Cancel</button>
                    <button id="policy-editor-save" onclick="savePolicyEditor()" style="padding:7px 18px;border:0;border-radius:4px;cursor:pointer;font-size:13px;background:#76b900;color:#000;font-weight:600;">Save</button>
                </div>
            </div>
        </div>
    </div>

<script>
let allPkeys = [];
let policy = null;

document.addEventListener('DOMContentLoaded', loadData);

async function loadData() {
    try {
        const resp = await fetch('/monitor-results/ib_pkey.json', {cache: 'no-store'});
        const data = await resp.json();
        allPkeys = normalizePkeys(data.pkeys || []);
        policy = data.policy || null;
        const summary = data.summary || {};
        document.getElementById('last-updated').textContent = data.last_update
            ? 'Last Updated: ' + new Date(data.last_update).toLocaleString('sv-SE').replace('T', ' ')
            : '';
        document.getElementById('total-pkeys').textContent = summary.total_pkeys || 0;
        document.getElementById('devices-polled').textContent = summary.devices_polled || 0;
        document.getElementById('inconsistency-count').textContent = summary.inconsistencies || 0;
        document.getElementById('ipoib-count').textContent = allPkeys.filter(p => p.ipoib_states && p.ipoib_states.includes('True')).length;
        document.getElementById('policy-count').textContent = summary.policy_violations || (policy?.violations || []).length || 0;

        if (summary.inconsistencies > 0) {
            document.getElementById('banner').innerHTML =
                `<div class="alert-box alert-warning"><strong>${summary.inconsistencies} P_Key inconsistencies detected.</strong> Same P_Key configured with different MTU/Rate/IPoIB on different switches.</div>`;
        }
        renderPolicy(policy);
        renderTable();
    } catch (e) {
        document.getElementById('pkey-table').innerHTML =
            '<tr><td colspan="8"><div class="no-data"><h3>No P_Key data yet</h3><p>Wait for the next monitor cycle.</p></div></td></tr>';
    }
}

function normalizePkeys(raw) {
    if (Array.isArray(raw)) return raw;
    // Demo / older schema may be object keyed by pkey.
    return Object.entries(raw || {}).map(([pkey, info]) => ({
        pkey,
        names: [info.name || ''],
        devices: [],
        device_count: 0,
        mtus: [],
        rates: [],
        ipoib_states: [String(!!info.ipoib)],
        max_members: info.member_count || (info.members || []).length || 0,
        consistent: true,
    }));
}

function renderPolicy(policy) {
    const el = document.getElementById('policy-section');
    if (!policy || !policy.enabled) {
        el.style.display = '';
        el.innerHTML = '<div class="alert-box alert-info"><strong>Expected P_Key policy is not configured.</strong> Add <code>expected_pkeys.yaml</code> next to <code>devices.yaml</code> to enable drift checks.</div>';
        return;
    }
    const findings = policy.violations || [];
    if (findings.length === 0) {
        el.style.display = '';
        el.innerHTML = '<div class="alert-box alert-info" style="background:rgba(76,175,80,0.08);border-left-color:#4caf50;color:#a5d6a7;"><strong>Expected P_Key policy passed.</strong> Actual partitions match <code>expected_pkeys.yaml</code>.</div>';
        return;
    }
    el.style.display = '';
    const rows = findings.map(f => `<tr>
        <td><span class="badge ${f.severity === 'critical' ? 'badge-red' : f.severity === 'warning' ? 'badge-yellow' : 'badge-blue'}">${f.severity}</span></td>
        <td class="mono">${f.pkey}</td>
        <td>${f.type}</td>
        <td>${f.message}</td>
    </tr>`).join('');
    el.innerHTML = `<div class="table-container"><table class="data-table">
        <thead><tr><th>Severity</th><th>P_Key</th><th>Type</th><th>Finding</th></tr></thead>
        <tbody>${rows}</tbody>
    </table></div>`;
}

function renderTable() {
    const mode = document.getElementById('filter-mode').value;
    const search = document.getElementById('filter-search').value.trim().toLowerCase();

    let filtered = allPkeys.slice();
    if (mode === 'inconsistent') filtered = filtered.filter(p => !p.consistent);
    if (mode === 'ipoib') filtered = filtered.filter(p => p.ipoib_states && p.ipoib_states.includes('True'));

    if (search) {
        filtered = filtered.filter(p => {
            const hay = `${p.pkey} ${(p.names||[]).join(' ')} ${(p.devices||[]).join(' ')}`.toLowerCase();
            return hay.includes(search);
        });
    }

    const tbody = document.getElementById('pkey-table');
    if (filtered.length === 0) {
        tbody.innerHTML = '<tr><td colspan="8"><div class="no-data"><h3>No P_Keys match the filter</h3></div></td></tr>';
        return;
    }

    tbody.innerHTML = filtered.map(p => {
        const ipoib = (p.ipoib_states || []).includes('True')
            ? '<span class="badge badge-green">YES</span>'
            : '<span class="badge badge-gray">NO</span>';
        const status = p.consistent
            ? '<span class="badge badge-green">consistent</span>'
            : '<span class="badge badge-yellow">inconsistent</span>';
        return `<tr>
            <td><strong class="mono">${p.pkey}</strong></td>
            <td>${(p.names || []).map(n => `<span class="badge badge-blue">${n}</span>`).join(' ') || '-'}</td>
            <td>${ipoib}</td>
            <td>${(p.mtus || []).join(', ') || '-'}</td>
            <td>${(p.rates || []).join(', ') || '-'}</td>
            <td>${p.device_count} <span style="color:#666;font-size:11px;">(${(p.devices||[]).slice(0,3).join(', ')}${p.devices && p.devices.length > 3 ? '...' : ''})</span></td>
            <td>${p.max_members || 0}</td>
            <td>${status}</td>
        </tr>`;
    }).join('');
}

async function openPolicyEditor() {
    document.getElementById('policy-editor-overlay').style.display = 'flex';
    const ta = document.getElementById('policy-editor-textarea');
    const status = document.getElementById('policy-editor-status');
    const saveBtn = document.getElementById('policy-editor-save');
    ta.value = 'Loading...'; ta.disabled = true; saveBtn.disabled = true;
    status.textContent = ''; status.style.color = '#888';
    try {
        const r = await fetch('/edit-expected-pkeys', {cache:'no-store'});
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const data = await r.json();
        if (!data.success) throw new Error(data.error || 'Server refused request');
        document.getElementById('policy-editor-path').textContent = data.path || 'expected_pkeys.yaml';
        ta.value = data.content || '';
        ta.disabled = false; saveBtn.disabled = false;
        status.textContent = `Loaded ${ta.value.length} bytes`;
    } catch (e) {
        ta.value = ''; ta.disabled = true;
        status.style.color = '#f44336';
        status.textContent = 'Error: ' + e.message;
    }
}

function closePolicyEditor() {
    document.getElementById('policy-editor-overlay').style.display = 'none';
}

async function savePolicyEditor() {
    const ta = document.getElementById('policy-editor-textarea');
    const status = document.getElementById('policy-editor-status');
    const saveBtn = document.getElementById('policy-editor-save');
    saveBtn.disabled = true;
    status.style.color = '#888';
    status.textContent = 'Saving...';
    try {
        const r = await fetch('/edit-expected-pkeys', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({content: ta.value}),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok || data.success === false) throw new Error(data.error || `HTTP ${r.status}`);
        status.style.color = '#4caf50';
        status.textContent = data.message || 'Saved';
        setTimeout(() => closePolicyEditor(), 700);
    } catch (e) {
        status.style.color = '#f44336';
        status.textContent = 'Error: ' + e.message;
        saveBtn.disabled = false;
    }
}
</script>
</body>
</html>
