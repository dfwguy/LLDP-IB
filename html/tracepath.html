<!DOCTYPE html>
<html>
<head>
    <link rel="shortcut icon" href="/png/lldpq-logo.svg">
    <title>..::LLDPQ-IB:: Tracepath</title>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <link rel="stylesheet" href="css/lldpq-ib.css">
    <script src="css/auth.js"></script>
    <script src="css/lldpq-ib.js"></script>
    <style>
        .trace-form {
            display: grid;
            grid-template-columns: 1fr auto 1fr auto auto auto;
            gap: 12px; align-items: end; margin-bottom: 20px;
        }
        .trace-form .filter-group { width: 100%; }
        .trace-form input[type="text"] {
            width: 100%; padding: 10px 12px; background: #2d2d2d;
            border: 1px solid #404040; color: #fff; border-radius: 6px;
            font-size: 13px; font-family: 'Cascadia Code', monospace;
        }
        .trace-form input[type="text"]:focus { border-color: #76b900; outline: none; }
        .swap-btn {
            background: #2d2d2d; color: #76b900; border: 1px solid #404040;
            padding: 10px 14px; border-radius: 6px; font-size: 18px; cursor: pointer;
        }
        .swap-btn:hover { background: #353535; border-color: #76b900; }
        .clear-btn {
            background: #404040; color: #ccc; border: 0; padding: 10px 14px;
            border-radius: 6px; font-size: 13px; cursor: pointer;
        }
        .clear-btn:hover { background: #555; }

        .mode-row {
            display: flex; gap: 18px; align-items: center;
            font-size: 12px; color: #888; margin-bottom: 18px;
        }
        .mode-row label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
        .mode-row input[type="radio"] { accent-color: #76b900; cursor: pointer; }

        .path-vis { background: #252526; border-radius: 6px; padding: 20px; }
        .path-row {
            display: flex; align-items: center; gap: 12px;
            padding: 10px 12px; background: #1a1a1a; border-radius: 4px;
            margin-bottom: 6px;
        }
        .path-row .hop-num {
            background: #76b900; color: #000; width: 28px; height: 28px;
            border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-weight: 600; font-size: 13px;
        }
        .path-row.endpoint .hop-num { background: #4fc3f7; }
        .path-arrow {
            text-align: center; color: #76b900; font-size: 18px;
            margin: 2px 0 2px 22px;
        }
        .path-arrow .meta {
            font-size: 11px; margin-left: 10px; color: #888;
            font-family: 'Cascadia Code', monospace;
        }
        .path-row .node-info { flex: 1; }
        .path-row .node-name { font-weight: 600; }
        .path-row .node-guid {
            font-family: 'Cascadia Code', monospace;
            font-size: 11px; color: #888;
        }

        .spinner {
            display: inline-block; width: 14px; height: 14px;
            border: 2px solid #404040; border-top-color: #76b900;
            border-radius: 50%; animation: spin .8s linear infinite;
            margin-right: 6px; vertical-align: middle;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="page-header">
        <div>
            <div class="page-title">IB Tracepath</div>
            <div class="last-updated" id="last-updated"></div>
        </div>
    </div>

    <div class="trace-form">
        <div class="filter-group">
            <label>Source (GUID, LID, or hostname)</label>
            <input type="text" id="src" list="device-list"
                   placeholder="ib-spine-01 or 0x0002c903..."
                   autocomplete="off">
        </div>
        <button class="swap-btn" onclick="swap()" title="Swap source and destination">↔</button>
        <div class="filter-group">
            <label>Destination</label>
            <input type="text" id="dst" list="device-list"
                   placeholder="ib-host-04 or 0x0002c903..."
                   autocomplete="off">
        </div>
        <button class="btn btn-primary" id="trace-btn" onclick="trace()">Trace</button>
        <button class="clear-btn" onclick="clearForm()">Clear</button>
        <datalist id="device-list"></datalist>
    </div>

    <div class="mode-row">
        <span>Mode:</span>
        <label><input type="radio" name="mode" value="bfs"      checked> Topology BFS (cached, fast)</label>
        <label><input type="radio" name="mode" value="ibtracert"> ibtracert (live, runs on the UFM appliance)</label>
    </div>

    <div class="summary-grid" id="summary" style="display:none;">
        <div class="summary-card card-info"><div class="card-value" id="hop-count">-</div><div class="card-label">Hops</div></div>
        <div class="summary-card card-info"><div class="card-value" id="src-type">-</div><div class="card-label">Source Type</div></div>
        <div class="summary-card card-info"><div class="card-value" id="dst-type">-</div><div class="card-label">Destination Type</div></div>
        <div class="summary-card card-info"><div class="card-value" id="trace-mode">-</div><div class="card-label">Mode</div></div>
    </div>

    <div id="result"></div>

<script>
let topo = null;
let nodeIndex = {};                 // guid -> node
let nameIndex = {};                 // hostname (lowercase) -> guid

document.addEventListener('DOMContentLoaded', loadTopology);

async function loadTopology() {
    try {
        const resp = await fetch('/monitor-results/ib_topology.json', {cache: 'no-store'});
        topo = await resp.json();
        document.getElementById('last-updated').textContent =
            'Topology: ' + (topo.generated_at || 'unknown');
        nodeIndex = {};
        nameIndex = {};
        (topo.nodes || []).forEach(n => {
            if (n.guid) nodeIndex[n.guid] = n;
            const h = (n.description || n.hostname || '').toLowerCase();
            if (h) nameIndex[h] = n.guid;
        });
        populateDatalist();
        // URL pre-fill: ?from=...&to=...
        const params = new URLSearchParams(location.search);
        if (params.get('from')) document.getElementById('src').value = params.get('from');
        if (params.get('to'))   document.getElementById('dst').value = params.get('to');
        if (params.get('from') && params.get('to')) setTimeout(trace, 200);
        document.getElementById('src').focus();
    } catch (e) {
        document.getElementById('result').innerHTML =
            `<div class="no-data"><h3>Topology not loaded</h3><p>${e.message}</p></div>`;
    }
}

function populateDatalist() {
    const list = document.getElementById('device-list');
    list.innerHTML = (topo.nodes || [])
        .filter(n => n.description || n.hostname)
        .map(n => `<option value="${n.description || n.hostname}">${n.type || ''}, LID ${n.lid}, ${n.guid}</option>`)
        .join('');
}

// Resolve user input (hostname OR GUID OR LID) to a GUID
function resolveGuid(input) {
    const s = (input || '').trim();
    if (!s) return null;
    if (/^0x[0-9a-f]+$/i.test(s)) {
        return nodeIndex[s] ? s : null;
    }
    // LID? -- exact decimal match
    if (/^\d+$/.test(s)) {
        const node = (topo.nodes || []).find(n => String(n.lid) === s);
        return node ? node.guid : null;
    }
    // hostname / description substring (prefer exact match)
    const exact = nameIndex[s.toLowerCase()];
    if (exact) return exact;
    const partial = (topo.nodes || []).find(n =>
        (n.description || n.hostname || '').toLowerCase().includes(s.toLowerCase())
    );
    return partial ? partial.guid : null;
}

function swap() {
    const src = document.getElementById('src');
    const dst = document.getElementById('dst');
    [src.value, dst.value] = [dst.value, src.value];
    if (src.value && dst.value) trace();
}

function clearForm() {
    document.getElementById('src').value = '';
    document.getElementById('dst').value = '';
    document.getElementById('result').innerHTML = '';
    document.getElementById('summary').style.display = 'none';
    document.getElementById('src').focus();
}

document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' &&
        (document.activeElement?.id === 'src' || document.activeElement?.id === 'dst')) {
        e.preventDefault(); trace();
    }
});

async function trace() {
    const src = document.getElementById('src').value;
    const dst = document.getElementById('dst').value;
    const btn = document.getElementById('trace-btn');
    const result = document.getElementById('result');

    if (!src || !dst) {
        await LLDPqUI.alert({
            title: 'Missing input',
            message: 'Please enter both source and destination.',
            type: 'warning',
        });
        return;
    }

    const srcGuid = resolveGuid(src);
    const dstGuid = resolveGuid(dst);
    if (!srcGuid || !dstGuid) {
        await LLDPqUI.alert({
            title: 'Unknown device',
            message: `Could not resolve ${!srcGuid ? `<strong>${escapeHtml(src)}</strong>` : ''}`
                   + (!srcGuid && !dstGuid ? ' and ' : '')
                   + `${!dstGuid ? `<strong>${escapeHtml(dst)}</strong>` : ''} to a node in the topology.`
                   + '<br><br>Try a different GUID, LID, or hostname (autocomplete suggestions are available in the input).',
            type: 'error',
        });
        return;
    }
    if (srcGuid === dstGuid) {
        await LLDPqUI.alert({
            title: 'Same node',
            message: 'Source and destination resolve to the same node. Pick two different endpoints.',
            type: 'warning',
        });
        return;
    }

    const mode = (document.querySelector('input[name="mode"]:checked') || {value: 'bfs'}).value;
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span>Tracing...';
    result.innerHTML = '';

    try {
        let path = null;
        if (mode === 'ibtracert') {
            path = await ibtracertTrace(srcGuid, dstGuid);
            if (!path) {
                // Backend not available (e.g. demo) -- fall back to BFS with a notice
                await LLDPqUI.alert({
                    title: 'Live ibtracert unavailable',
                    message: 'Could not run <code>ibtracert</code> on the UFM appliance '
                           + '(UFM SSH not configured, or demo mode). '
                           + 'Falling back to topology BFS for the path computation.',
                    type: 'info',
                });
                path = bfs(srcGuid, dstGuid);
            }
        } else {
            path = bfs(srcGuid, dstGuid);
        }
        renderResult(srcGuid, dstGuid, path, mode);
    } catch (e) {
        result.innerHTML = `<div class="alert-box alert-danger">Trace failed: ${escapeHtml(e.message)}</div>`;
    } finally {
        btn.disabled = false;
        btn.textContent = 'Trace';
    }
}

function bfs(srcGuid, dstGuid) {
    const adj = {};
    (topo.links || []).forEach(l => {
        (adj[l.source_guid] ||= []).push({ to: l.target_guid, lp: l.source_port, rp: l.target_port, speed: l.speed });
        (adj[l.target_guid] ||= []).push({ to: l.source_guid, lp: l.target_port, rp: l.source_port, speed: l.speed });
    });
    const visited = new Set([srcGuid]);
    const queue = [{ guid: srcGuid, path: [] }];
    while (queue.length) {
        const { guid, path } = queue.shift();
        if (guid === dstGuid) return path;
        for (const next of (adj[guid] || [])) {
            if (visited.has(next.to)) continue;
            visited.add(next.to);
            queue.push({ guid: next.to, path: [...path, { to_guid: next.to, lp: next.lp, rp: next.rp, speed: next.speed }] });
        }
    }
    return null;
}

async function ibtracertTrace(srcGuid, dstGuid) {
    try {
        const r = await fetch('/ib-api.sh?action=ibtracert', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ src_guid: srcGuid, dst_guid: dstGuid }),
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok || data.success === false) return null;
        return data.path || null;     // {to_guid, lp, rp, speed}[]
    } catch (e) {
        return null;
    }
}

function renderResult(srcGuid, dstGuid, path, mode) {
    const result = document.getElementById('result');
    const summary = document.getElementById('summary');
    if (!path) {
        result.innerHTML = '<div class="alert-box alert-danger">No path found between the two endpoints in the topology.</div>';
        summary.style.display = 'none';
        return;
    }

    const start = nodeIndex[srcGuid];
    const end   = nodeIndex[dstGuid];

    summary.style.display = '';
    document.getElementById('hop-count').textContent = path.length;
    document.getElementById('src-type').textContent  = (start && start.type) || '-';
    document.getElementById('dst-type').textContent  = (end && end.type) || '-';
    document.getElementById('trace-mode').textContent = mode === 'ibtracert' ? 'ibtracert' : 'BFS';

    const rows = [nodeRow(0, start, true)];
    path.forEach((hop, i) => {
        rows.push(`<div class="path-arrow">↓<span class="meta">port ${hop.lp} → port ${hop.rp}${hop.speed ? `  (${hop.speed})` : ''}</span></div>`);
        const isLast = (i === path.length - 1);
        rows.push(nodeRow(i + 1, nodeIndex[hop.to_guid], isLast));
    });
    result.innerHTML = `
        <div class="path-vis">
            <div style="color:#76b900; margin-bottom: 12px; font-weight: 600;">
                Path: ${start && start.description}  →  ${end && end.description}
                &nbsp;·&nbsp; ${path.length} hop${path.length === 1 ? '' : 's'}
            </div>
            ${rows.join('')}
        </div>`;
}

function nodeRow(idx, node, isEndpoint) {
    if (!node) return '';
    const badge = node.type === 'switch'
        ? '<span class="badge badge-green">switch</span>'
        : node.type === 'hca'
            ? '<span class="badge badge-blue">hca</span>'
            : `<span class="badge badge-gray">${node.type || ''}</span>`;
    return `
        <div class="path-row ${isEndpoint ? 'endpoint' : ''}">
            <div class="hop-num">${idx}</div>
            <div class="node-info">
                <div class="node-name">
                    <a href="device.html?device=${encodeURIComponent(node.description || '')}" target="_top"
                       style="color:#76b900; text-decoration:none;">${node.description || '(no name)'}</a>
                    ${badge}
                </div>
                <div class="node-guid">${node.guid} (LID ${node.lid != null ? node.lid : '-'})</div>
            </div>
        </div>`;
}

function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
}
</script>
</body>
</html>
